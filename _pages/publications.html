{% include base_path %}

<div class="pub-filters">
  <input type="text" id="pub-search" placeholder="Search publications">
  <div class="pub-filter-buttons" id="type-filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="inproceedings">Conference</button>
    <button class="filter-btn" data-filter="article">Journal</button>
    <button class="filter-btn" data-filter="phdthesis">Thesis</button>
    <select id="year-select" class="year-select">
      <option value="all">All years</option>
    </select>
  </div>
</div>

{% bibliography %}

<!-- NOTE: Comment this and uncomment the script below to only filter in title, author, venue and abstract.
    The version below filters everything that's in papers.bib, including things like "artifact" or "to appear" -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var searchInput = document.getElementById("pub-search");
  var typeButtons = document.querySelectorAll("#type-filters .filter-btn");
  var yearSelect = document.getElementById("year-select");
  var activeType = "all";
  var activeYear = "all";

  // Build year dropdown options dynamically from whatever years exist
  var years = [];
  document.querySelectorAll(".pub-entry").forEach(function (entry) {
    var y = entry.getAttribute("data-year");
    if (y && years.indexOf(y) === -1) years.push(y);
  });
  years.sort().reverse();

  years.forEach(function (year) {
    var option = document.createElement("option");
    option.value = year;
    option.textContent = year;
    yearSelect.appendChild(option);
  });

  function applyFilters() {
    var searchTerm = searchInput.value.toLowerCase();
    var entries = document.querySelectorAll(".pub-entry");

    entries.forEach(function (entry) {
      var entryType = entry.getAttribute("data-type");
      var entryYear = entry.getAttribute("data-year");
      var listItem = entry.closest("li");

      var matchesType = activeType === "all" || entryType === activeType;
      var matchesYear = activeYear === "all" || entryYear === activeYear;
      var matchesSearch = entry.textContent.toLowerCase().indexOf(searchTerm) !== -1;

      listItem.style.display = (matchesType && matchesYear && matchesSearch) ? "" : "none";
    });

    document.querySelectorAll("h2.bibliography").forEach(function (heading) {
      var list = heading.nextElementSibling;
      if (!list) return;
      var visibleItems = list.querySelectorAll("li:not([style*='display: none'])");
      heading.style.display = visibleItems.length > 0 ? "" : "none";
    });
  }

  typeButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      typeButtons.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      activeType = btn.getAttribute("data-filter");
      applyFilters();
    });
  });

  yearSelect.addEventListener("change", function () {
    activeYear = yearSelect.value;
    applyFilters();
  });

  searchInput.addEventListener("input", applyFilters);
});
</script>
